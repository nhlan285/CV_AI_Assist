{% extends "base.html" %}

{% block title %}Đăng ký nhà tuyển dụng{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 auth-card">
    <div class="section-panel p-4">
      <h1 class="h4 mb-4">Đăng ký nhà tuyển dụng</h1>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include "recruitment/_form_fields.html" %}
        <button class="btn btn-primary" type="submit">Tạo tài khoản và công ty</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
