{% extends "base.html" %}

{% block title %}Đăng ký ứng viên{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="section-panel p-4">
      <h1 class="h4 mb-1">Đăng ký ứng viên</h1>
      <p class="text-muted-ats mb-4">Tạo hồ sơ để lưu CV, ứng tuyển và theo dõi trạng thái.</p>
      <form method="post">
        {% csrf_token %}
        {% include "recruitment/_form_fields.html" %}
        <button class="btn btn-primary" type="submit">Tạo tài khoản</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
