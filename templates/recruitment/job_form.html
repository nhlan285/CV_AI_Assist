{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="section-panel p-4">
      <h1 class="h4 mb-3">{{ title }}</h1>
      <form method="post">
        {% csrf_token %}
        {% include "recruitment/_form_fields.html" %}
        <button class="btn btn-primary" type="submit">Lưu bài tuyển dụng</button>
        <a class="btn btn-outline-secondary" href="{% url 'recruiter_jobs' %}">Quay lại</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
