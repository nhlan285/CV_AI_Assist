{% extends "base.html" %}

{% block title %}Xóa bài tuyển dụng{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="section-panel p-4">
      <h1 class="h4">Xóa bài tuyển dụng</h1>
      <p>Bạn có chắc muốn xóa <strong>{{ job.title }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Xóa</button>
        <a class="btn btn-outline-secondary" href="{% url 'recruiter_jobs' %}">Hủy</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
