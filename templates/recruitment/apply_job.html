{% extends "base.html" %}

{% block title %}Ứng tuyển {{ job.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="section-panel p-4">
      <h1 class="h4 mb-1">Ứng tuyển {{ job.title }}</h1>
      <p class="text-muted-ats mb-4">{{ job.company.name }} | {{ job.location }}</p>
      <form method="post">
        {% csrf_token %}
        {% include "recruitment/_form_fields.html" %}
        <button class="btn btn-primary" type="submit">Gửi ứng tuyển và tính ATS</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
